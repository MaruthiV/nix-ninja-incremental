name: correctness

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scanner-oracle:
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.work/target
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Pinned upstream source
        run: python3 tools/dev.py prepare
      - name: Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
      - name: Formatting
        run: cargo +1.95.0 fmt --manifest-path benchmarks/scanner/Cargo.toml --check
      - name: Compiler checks
        run: cargo +1.95.0 clippy --locked --release --all-targets --manifest-path benchmarks/scanner/Cargo.toml -- -D warnings
      - name: Scanner binary
        run: cargo +1.95.0 build --locked --release --manifest-path benchmarks/scanner/Cargo.toml
      - name: Oracle sensitivity
        run: python3 -m unittest discover -s tests -v
      - name: Compiler versus scanner
        run: python3 tools/oracle.py --scanner .work/target/release/nni-scanner-bench --output results/ci/scanner.json
      - name: Path observation diagnostics
        run: cargo +1.95.0 run --locked --release --manifest-path benchmarks/scanner/Cargo.toml --example path_cache

  patch-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [resolver, profile, corrected-profile, observed, corrected-embed, embed, aliases, recording]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.work/target-patches
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Pinned patch variant
        run: python3 tools/variants.py prepare ${{ matrix.variant }}
      - name: Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
      - name: Formatting
        run: cargo +1.95.0 fmt --all --manifest-path .work/nix-ninja-${{ matrix.variant }}/Cargo.toml --check
      - name: Compiler checks
        run: cargo +1.95.0 clippy --locked --workspace --all-targets --manifest-path .work/nix-ninja-${{ matrix.variant }}/Cargo.toml -- -D warnings
      - name: Workspace tests
        run: cargo +1.95.0 test --locked --workspace --manifest-path .work/nix-ninja-${{ matrix.variant }}/Cargo.toml
      - name: Planner binary
        if: contains(matrix.variant, 'profile') || matrix.variant == 'recording'
        run: cargo +1.95.0 build --locked --manifest-path .work/nix-ninja-${{ matrix.variant }}/Cargo.toml -p nix-ninja
      - name: Profile input isolation and failures
        if: contains(matrix.variant, 'profile')
        run: python3 tests/profile_checks.py --binary .work/target-patches/debug/nix-ninja
      - name: Discovery CLI and controller lease
        if: matrix.variant == 'recording'
        run: python3 tests/discovery_cli_checks.py --binary .work/target-patches/debug/nix-ninja
