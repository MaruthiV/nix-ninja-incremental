name: nix baseline

on:
  workflow_dispatch:
  push:
    paths:
      - environment/**
      - tools/dev.py
      - tools/build_oracle.py
      - tools/input_view.py
      - tests/fixtures/build_edits.json
      - tests/fixtures/alias_build_edits.json
      - tests/fixtures/embed.json
      - benchmarks/embedded/**
      - patches/**
      - .github/workflows/nix-baseline.yml
  pull_request:
    paths:
      - environment/**
      - tools/dev.py
      - tools/build_oracle.py
      - tools/input_view.py
      - tests/fixtures/build_edits.json
      - tests/fixtures/alias_build_edits.json
      - tests/fixtures/embed.json
      - benchmarks/embedded/**
      - patches/**
      - .github/workflows/nix-baseline.yml

permissions:
  contents: read

concurrency:
  group: nix-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Pinned upstream source
        run: python3 tools/dev.py prepare
      - name: Isolated Nix daemon
        run: python3 tools/dev.py up
      - name: Pinned Nix runtime
        run: python3 tools/dev.py runtime
      - name: Environment manifest
        run: python3 tools/dev.py info
      - name: Fresh and warm example
        run: python3 tools/dev.py baseline
      - name: Corrected build oracle variant
        run: python3 tools/variants.py prepare corrected-embed
      - name: Fresh artifact edit oracle
        run: >-
          python3 tools/dev.py exec -- nix-shell --impure
          --expr '(import /workspace/environment/baseline.nix { source = /workspace/.work/nix-ninja-corrected-embed; }).shell'
          --run 'python3 /workspace/tools/build_oracle.py'
      - name: Embedded resource scanner variant
        run: python3 tools/variants.py prepare embed
      - name: GCC embedded resource oracle
        run: >-
          python3 tools/dev.py exec -- nix-shell --impure /workspace/environment/shell.nix
          --run 'CARGO_HOME=/workspace/.work/cargo CARGO_TARGET_DIR=/workspace/.work/target-embed
          cargo build --locked --release --manifest-path /workspace/benchmarks/embedded/Cargo.toml
          && python3 /workspace/tools/oracle.py
          --scanner /workspace/.work/target-embed/release/nni-embed-scanner
          --fixtures /workspace/tests/fixtures/embed.json
          --output /workspace/results/setup/embed-compiler.json'
      - name: Logical dependency path variant
        run: python3 tools/variants.py prepare aliases
      - name: Alias artifact edit oracle
        run: >-
          python3 tools/dev.py exec -- nix-shell --impure
          --expr '(import /workspace/environment/baseline.nix { source = /workspace/.work/nix-ninja-aliases; }).shell'
          --run 'python3 /workspace/tools/build_oracle.py
          && python3 /workspace/tools/build_oracle.py --fixture /workspace/tests/fixtures/alias_build_edits.json'
      - name: Setup records
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: nix-baseline-${{ github.run_id }}
          path: |
            results/setup/
            results/oracle/
          if-no-files-found: warn
          retention-days: 7
      - name: Stop project daemon
        if: always()
        run: python3 tools/dev.py stop
